<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kesehatan Otak</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            color: #222;
            line-height: 1.7;
        }

        /* NAVBAR */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #151b4f;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #63d8ff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #63d8ff;
        }

        /* HERO */
        .hero {
            min-height: 600px;
            background: linear-gradient(135deg, #151b4f, #263c91, #3978c9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 70px 8%;
            gap: 40px;
            overflow: hidden;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-text small {
            color: #63d8ff;
            font-size: 16px;
            font-weight: bold;
        }

        .hero-text h1 {
            font-size: 58px;
            line-height: 1.1;
            margin: 15px 0;
        }

        .hero-text p {
            font-size: 18px;
            color: #e4e9ff;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #63d8ff;
            color: #10204d;
            padding: 13px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-4px);
            background: white;
        }

        /* GAMBAR OTAK */
        .brain-box {
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(99,216,255,0.25);
        }
